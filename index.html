<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6ef"><link rel="manifest" href="manifest.webmanifest"><title>Schreibheft</title><style>
:root{font-family:system-ui,sans-serif;color:#172849;background:#f8f6ef}*{box-sizing:border-box}body{margin:0}.app{max-width:950px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(30px,5vw,46px);margin:12px 0}h2{font-size:25px}.brand{font-size:13px;color:#5b6877}button{font:inherit;font-weight:700;border:0;border-radius:17px;padding:16px 20px;cursor:pointer;color:#172849;background:#d7ecf9;min-height:52px}button.primary{background:#65b94b;color:white}button.danger{background:#ffe0dc;color:#8d3434}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2b79ca} .actions{display:flex;gap:12px;flex-wrap:wrap}.home{display:grid;gap:14px;max-width:540px;margin:40px auto}.home button{font-size:22px;padding:23px}.paper{background:white;border:2px solid #e4e5e2;border-radius:20px;padding:16px;box-shadow:0 5px 18px #1728490a}input,textarea{width:100%;font:inherit;color:#172849;border:1px solid #d4d8df;border-radius:12px;padding:14px;background:white}input{font-size:24px;font-weight:700}textarea{margin-top:12px;resize:vertical;min-height:45vh;font-size:var(--writing-size,23px);line-height:1.65}.item{display:flex;align-items:center;gap:10px;background:white;border:1px solid #dfe2e5;border-radius:16px;padding:10px;margin:10px 0}.item button:first-child{flex:1;text-align:left;background:transparent;overflow-wrap:anywhere}.muted{color:#697487;font-size:14px}#status{color:#28753b;font-size:14px}footer{text-align:center;margin-top:35px;color:#657085;font-size:12px}.hidden{display:none!important}@media(max-width:550px){.app{padding:14px}.actions button{flex:1}textarea{min-height:55vh}}
</style></head><body><main class="app"><header><div><div class="brand">✏️ von Marpet Studio</div><h1>Schreibheft</h1></div><span id="offline" class="muted">Lokal gespeichert</span></header><section id="home" class="home"><button class="primary" id="new">＋ Neuer Text</button><button id="openList">📁 Meine Texte</button></section><section id="list" class="hidden"><div class="actions"><button data-back>← Zurück</button><button class="primary" id="new2">＋ Neuer Text</button></div><h2>Meine Texte</h2><div id="items"></div></section><section id="editor" class="hidden"><div class="actions"><button id="backEditor">← Meine Texte</button><button id="smaller">A−</button><button id="larger">A＋</button><button id="export">📄 Als PDF drucken</button></div><div class="paper" style="margin-top:16px"><input id="title" aria-label="Titel" placeholder="Titel meines Textes" maxlength="120"><textarea id="content" aria-label="Mein Text" placeholder="Hier kannst du schreiben …"></textarea><div id="status" role="status">✓ Automatisch gespeichert</div></div></section><footer>Deine Texte bleiben auf diesem Tablet. Browserdaten nicht löschen! · Schreibheft 1.0</footer></main><script>
'use strict';const KEY='schreibheft-v1';let notes=[],current=null,saveTimer=null;const $=id=>document.getElementById(id);try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(value))notes=value}catch(e){alert('Gespeicherte Texte konnten nicht gelesen werden. Bitte keine Browserdaten löschen.')}function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));$('status').textContent='✓ Automatisch gespeichert'}catch(e){$('status').textContent='⚠ Speichern fehlgeschlagen! Speicher prüfen.';alert('Speichern fehlgeschlagen. Bitte den Text sichern.')}}function show(id){['home','list','editor'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='list')render()}function create(){const note={id:crypto.randomUUID(),title:'',content:'',updated:Date.now()};notes.unshift(note);persist();edit(note.id)}function edit(id){current=id;const n=notes.find(x=>x.id===id);if(!n)return show('list');$('title').value=n.title;$('content').value=n.content;$('status').textContent='✓ Automatisch gespeichert';show('editor');$('title').focus()}function save(){const n=notes.find(x=>x.id===current);if(!n)return;n.title=$('title').value;n.content=$('content').value;n.updated=Date.now();persist()}function schedule(){ $('status').textContent='Speichert …';clearTimeout(saveTimer);saveTimer=setTimeout(save,250)}function flush(){clearTimeout(saveTimer);if(current)save()}function render(){const root=$('items');root.replaceChildren();if(!notes.length){const p=document.createElement('p');p.textContent='Noch keine Texte vorhanden.';root.append(p)}notes.slice().sort((a,b)=>b.updated-a.updated).forEach(n=>{const row=document.createElement('div');row.className='item';const open=document.createElement('button');const name=document.createElement('strong');name.textContent=n.title.trim()||'Ohne Titel';const date=document.createElement('div');date.className='muted';date.textContent=new Date(n.updated).toLocaleString('de-AT');open.append(name,date);open.onclick=()=>edit(n.id);const del=document.createElement('button');del.className='danger';del.textContent='Löschen';del.setAttribute('aria-label','Text löschen');del.onclick=()=>{if(confirm('Diesen Text wirklich löschen?')){notes=notes.filter(x=>x.id!==n.id);persist();render()}};row.append(open,del);root.append(row)})}function printNote(){flush();const n=notes.find(x=>x.id===current);if(!n)return;const w=window.open('','_blank');if(!w){alert('Bitte Pop-ups für den PDF-Export erlauben.');return}const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));w.document.write('<!doctype html><html lang="de"><meta charset="utf-8"><title>Schreibheft</title><style>body{font:18px/1.6 Arial,sans-serif;max-width:800px;margin:35px auto;padding:20px}article{white-space:pre-wrap;overflow-wrap:anywhere}h1{overflow-wrap:anywhere}</style><h1>'+esc(n.title||'Mein Text')+'</h1><article>'+esc(n.content)+'</article></html>');w.document.close();w.focus();setTimeout(()=>w.print(),350)}$('new').onclick=$('new2').onclick=create;$('openList').onclick=()=>show('list');document.querySelectorAll('[data-back]').forEach(x=>x.onclick=()=>show('home'));$('backEditor').onclick=()=>{flush();show('list')};$('title').addEventListener('input',schedule);$('content').addEventListener('input',schedule);$('export').onclick=printNote;let size=Number(localStorage.getItem('schreibheft-size')||23);function setSize(){document.documentElement.style.setProperty('--writing-size',size+'px');localStorage.setItem('schreibheft-size',size)}$('smaller').onclick=()=>{size=Math.max(16,size-2);setSize()};$('larger').onclick=()=>{size=Math.min(36,size+2);setSize()};setSize();document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});window.addEventListener('pagehide',flush);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
